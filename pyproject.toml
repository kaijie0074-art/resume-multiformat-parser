[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-parser"
version = "1.0.0"
description = "简历多格式解析路由：文本层判空、双栏重排、docx 表格、OCR 后端抽象与字段级 F1 评估（本地确定性演练）"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
    "pillow>=10.0",
]

[tool.setuptools.packages.find]
include = ["resume_parser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
